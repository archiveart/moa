/* AI 카드 출처 문장(11/5 피드백 2 · 20P): 네 칸 같은 출처 · 해요체 한 문장 · 시제만 다르게 · 사전 글자 수 ±10% · 판매·인기·사회적 증거 단어 없음
   글자 수(공백 제외) 사전 20자 / 사후 19자 = −5% */
const CARD_SRC = {pre:'최근에 본 상품과 검색 기록을 참고해서 고를게요', post:'최근에 본 상품과 검색 기록을 참고해서 골랐어요'};
function topCardPre(){
  return `<div class="topcard"><div class="ai-lbl">${ICON.spark} AI 맞춤 추천</div>
    <div class="ai-ttl"><span class="k">니트</span>를 골라 드릴게요</div>
    <div class="ai-sub">${CARD_SRC.pre}</div></div>`;   // 사후 '추천 이유'와 같은 출처, 시제만 다르게
}
function topCardPost(tags, label){
  return `<div class="topcard"><div class="ai-lbl">${ICON.spark} AI 맞춤 추천</div>
    <div class="ai-ttl"><span class="k">니트</span> 6개를 골라 봤어요</div>
    <div class="reason"><b>추천 이유</b>${CARD_SRC.post}</div>
    ${tags.length ? `<div class="tagrow"><span class="tl">${label}</span>${tags.map(g => `<span class="tag ${g.on?'on':''}">${esc(g.label)}</span>`).join('')}</div>` : ''}</div>`;
}
function defaultTags(set){
  const a = SETS[set].initialAttr;
  return [{label:'#'+a.fit},{label:'#'+a.mat},{label:'#'+lenTag(a.len)}];
}
function liveTags(t){
  if (t.type === 'D') return t.excl.map(e => ({label: exTag(e), key: exLabel(e) + ' 제외', on:true}));
  return attrTags(t.cond, SETS[t.set].initialAttr);
}
/* 행동 태그(결과 · 사후 카드 공통). 11/5 피드백 6: TAG_MODE 'changed' = 바꾼 값만(결정의 '뺀 것만'과 같은 구조, 네 칸 같게)
   · 'all' = 셋 다 보여 주고 그대로인 값은 회색(TAG_UNCHANGED_GREY) */
function attrTags(c, d){   // v20: 기본값이 없으니 고른 값만 태그로(네 칸 같은 규칙)
  return [['fit', c.fit && '#'+c.fit], ['mat', c.mat && '#'+c.mat], ['len', c.len && '#'+lenTag(c.len)]].filter(x => x[1]).map(x => ({label:x[1], on:true}));
}
/* v20: 조건 버튼은 V18처럼 글자 버튼(11/6 팀 결정 · 아이콘 넣었다가 되돌림). 제목만 '원하는 조건을 골라 주세요' */
function condPanel(cond){
  return `<div class="box cond"><div class="bt">원하는 조건을 골라 주세요</div>
    ${ATTRS.map(([k,lbl,vals]) => `<div class="row"><span class="rl">${lbl}</span>${vals.map(v => `<button class="pill ${cond[k]===v?'on':''}" data-act="attr" data-k="${k}" data-v="${v}" aria-pressed="${cond[k]===v}">${v}</button>`).join('')}</div>`).join('')}
  </div>`;
}
/* 안내 한 줄: 결정·행동이 같고 시점 단어만 달라요(본연구 방법 ★칸 비교) */
/* 안내 한 줄(피그마 설계): 가로(사전·사후)는 시점 단어만, 세로(결정·행동)는 유형 단어만 달라요 */
const HINT = {
  pre:  {D:'고르기 전에 원하지 않는 것을 뺄 수 있어요', A:'고르기 전에 조건을 바꿀 수 있어요'},
  post: {D:'마음에 들지 않는 것을 뺄 수 있어요',       A:'마음에 들지 않으면 조건을 바꿀 수 있어요'},
};
function recHTML(t, mode){
  // mode: 'live' | 'locked' | 'initial'
  const isPre = S.cond.X2 === '사전';
  const set = SETS[t.set];
  const excl = mode === 'initial' ? [] : t.excl;
  const cond = mode === 'initial' ? EMPTY_COND() : t.cond;   // v20: 처음 화면도 빈 패널
  const exHas = (k,v) => excl.some(e => e.kind === k && e.v === v);
  let body = '';
  if (isPre){
    body += topCardPre();
    body += `<div class="hint">${ICON.sliders}${HINT.pre[t.type]}${resetBtn(t, mode)}</div>`;
    if (t.type === 'D'){
      // 종류 카드: 사진 위에 이름 · 오른쪽 위 X. 누르면 '제외'(어둡게 + 보라 표시 · X 회색), 다시 누르면 되돌려요. 브랜드 칩은 누르면 회색
      body += `<div class="box"><div class="bt">원하지 않는 것을 눌러 빼 주세요</div><div class="bs bsub">AI가 후보로 본 니트 종류 · 최근에 본 상품 기준</div>
        <div class="styles">${set.styleCands.map(([lbl,img]) => { const off = exHas('style',lbl), name = STYLE_LABEL[lbl] || lbl; return `<button class="st ${off?'off':''}" data-act="ex-style" data-v="${lbl}" aria-pressed="${off}" aria-label="${name} ${off?'되돌리기':'빼기'}"><span class="clip"><img src="${IMG[img]}" alt=""><span class="lb">${name}</span><span class="ex">제외</span></span><span class="xb" aria-hidden="true">${ICON.xb}</span></button>`; }).join('')}</div>
        <div class="sep"></div><div class="bt">자주 본 브랜드</div>
        <div class="brands">${set.brandCands.map(b => { const off = exHas('brand',b); return `<button class="bchip ${off?'off':''}" data-act="ex-brand" data-v="${b}" aria-pressed="${off}">${b}${ICON.xs}</button>`; }).join('')}</div></div>`;
    } else {
      body += condPanel(cond);
    }
  } else {
    // 위 카드 태그: 처음엔 'AI 기본 설정', 바꾸면 고른 것을 그대로 보여 줘요(사후)
    const chosen = mode !== 'initial' && opsCount(t) > 0;
    body += topCardPost(chosen ? liveTags(t) : [], '내가 고른 조건');   // v20: 'AI 기본 설정' 태그 줄 없앰(빈 패널과 맞춤 · 사전에도 없는 단서)
    body += `<div class="hint">${ICON.sliders}${HINT.post[t.type]}${resetBtn(t, mode)}</div>`;
    const items = initialItems(t);
    if (t.type === 'D'){
      // 상품 태그에 종류를 보여 줘서 [이 종류 제외]가 무엇을 빼는지 알 수 있게(결정 결과 화면과 같은 표시)
      body += `<div class="dtitle">원하지 않는 것을 눌러 빼 주세요</div>`;   // V22_FB_5: 시점 단어 없이(사전 칸과 같은 제목)   // V22_FB_3: 행동 상자 제목('원하는 조건을 골라 주세요')과 같은 자리 · 같은 형식(4.4-5 통제 화면 구성 네 집단 같음)
      body += `<div class="grid">${items.map(p => { const sOn = exHas('style',p.styles[0]), bOn = exHas('brand',p.brand); return productCard(Object.assign({}, p, {meta:styleName(p.styles[0])}),{off:sOn||bOn, buttons:true, styleOn:sOn, brandOn:bOn}); }).join('')}</div>`;
    } else {
      body += condPanel(cond);
      body += `<div class="grid mt">${items.map(p => productCard(p)).join('')}</div>`;
    }
  }
  return `${statusBar()}${navBar()}<div class="scroll" data-sk="rec-${t.n}-${mode==='initial'?'i':'l'}"><div class="pad">${body}</div></div>
    <div class="bottom">${ctaSubmit(t, mode)}</div><div class="toast" id="toast"></div>`;
}
/* v20: [선택 초기화] — 결과를 보기 전까지만, 네 칸 같은 자리(안내 줄 오른쪽) */
function resetBtn(t, mode){ return mode === 'live' ? `<button class="rst" data-act="reset" ${opsCount(t) ? '' : 'disabled'}>선택 초기화</button>` : ''; }
/* [이대로 추천받기]: 조건을 하나도 고르지 않았으면 회색, 고르면 검정. 홈의 [추천받기]는 항상 검정 */
const ctaWasOn = {};
function ctaSubmit(t, mode){
  const on = mode !== 'initial' && opsCount(t) > 0;
  const key = t.n + mode, pop = on && ctaWasOn[key] === false;
  ctaWasOn[key] = on;
  return `<button class="cta ${on ? '' : 'is-off'} ${pop ? 'pop' : ''}" data-act="submit" aria-disabled="${on ? 'false' : 'true'}">이대로 추천받기</button>`;
}
/* V22_FB_11 엑셀 7번: 결과가 뜬 뒤 DONE_DELAY_SEC초 동안 [완료]는 회색('완료 (n)') — 상황 카드 [다음]과 같은 방식 · 네 칸 같음 */
function doneLeft(t){
  const sec = (DEV && !QS.has('gate')) ? 0 : (CONFIG.DONE_DELAY_SEC || 0);
  if (!sec || t.m.t_result == null) return 0;
  return Math.max(0, Math.ceil((t.m.t_result + sec * 1000 - elapsed()) / 1000));
}
function doneBtnHTML(t, locked){
  const left = locked ? 0 : doneLeft(t);
  return `<button class="cta ${left ? 'is-off' : ''}" data-act="done" aria-disabled="${left ? 'true' : 'false'}">${left ? `완료 (${left})` : '완료'}</button>`;
}
let doneTimer = null;
function tickDone(){
  clearTimeout(doneTimer);
  const st = curStep(); if (!st || st.kind !== 'result') return;
  const t = T(st.task); if (t.phase !== 'result') return;
  const b = document.querySelector('#screen .bottom [data-act=done]'); if (!b) return;
  const left = doneLeft(t);
  b.classList.toggle('is-off', left > 0); b.setAttribute('aria-disabled', left > 0 ? 'true' : 'false'); b.textContent = left > 0 ? `완료 (${left})` : '완료';
  if (left > 0) doneTimer = setTimeout(tickDone, 250);
}
function resultHTML(t, locked){
  const r = t.result, dv = !locked && t.viewDefault;
  const pre = S.cond.X2 === '사전';   // 11/5 피드백: 사전은 처음 6개를 본 적이 없으니 '반영' 배지 대신 위 문구로, 사후는 바뀐 상품에 배지
  const retry = CONFIG.RETRY_ON && !locked;
  const items = dv ? initialItems(t) : r.items;
  const dvMode = CONFIG.DEFAULT_VIEW_TOGGLE || 'none', dvOk = dvMode === 'all' || (dvMode === 'post' && S.cond.X2 === '사후');
  const toggle = (locked || !dvOk) ? '' : `<button class="dvbtn" data-act="toggle-default">${dv ? '내 조건으로 보기' : '기본 추천으로 보기'}</button>`;
  return `${statusBar()}${navBar()}<div class="scroll" data-sk="res-${t.n}${dv ? '-d' : ''}"><div class="pad">
    ${dv ? topCardPost(defaultTags(t.set), 'AI 기본 설정') : topCardPost(r.tags, '반영한 조건')}
    <div class="banner ${dv ? 'dv' : ''}">${dv ? 'AI가 처음 고른 기본 추천이에요' : ICON.check + (pre ? '알려 주신 대로 추천했어요' : '알려 주신 대로 골랐어요')}${toggle}</div>
    <div class="grid">${items.map(p => productCard(p,{badge:!dv && (!pre || CONFIG.BADGE_PRE), all:pre && CONFIG.BADGE_PRE_ALL})).join('')}</div>
  </div></div><div class="bottom ${retry ? 'two' : ''}">${retry ? '<button class="cta sub" data-act="retry">다시 해 보기</button>' : ''}${doneBtnHTML(t, locked)}</div><div class="toast" id="toast"></div>`;
}
function loadingHTML(){
  return `${statusBar()}${navBar()}<div class="loading"><div class="spin"></div>AI가 니트를 고르고 있어요</div>`;
}

/* 왼쪽 그리기 */
const left = document.getElementById('left');
let phoneMode = null;
if (window.ResizeObserver) new ResizeObserver(() => fitPhone()).observe(left);   // v22: 위 막대가 생기거나 창 크기가 바뀌어도 폰 크기를 다시 맞춰요
function ensurePhone(){
  if (phoneMode === 'single') return;
  left.innerHTML = `<div class="phone-wrap" id="pw"><div class="phone"><div class="screen" id="screen"></div></div></div><div class="pside" id="pside"><div class="pguide" id="pguide"></div><div class="gate" id="gate"></div></div>`;
  phoneMode = 'single';
  document.getElementById('screen').addEventListener('click', onAppClick);
  fitPhone();
}
function fitPhone(){
  const pw = document.getElementById('pw');
  if (pw){
    // v22(11/6 교수님 피드백): 창 높이에 맞춰 크게. 배율은 창 크기로만 정해져 네 칸 · 모든 쇼핑 화면에서 같아요
    const W = left.clientWidth, H = left.clientHeight, side = 250, gap = 28, pad = 14;
    const s = Math.max(0.3, Math.min(CONFIG.PHONE_MAX_SCALE || 1, (H - pad * 2) / 868, (W - pad * 2 - (side + gap) * 2) / 414));
    const pwW = 414 * s;
    let cx = W / 2;   // 폰은 가운데. 오른쪽 안내 자리가 모자랄 때만 왼쪽으로
    if (cx + pwW / 2 + gap + side > W - pad) cx = Math.max(pad + pwW / 2, W - pad - side - gap - pwW / 2);
    pw.style.transform = `translateX(${Math.round(cx - W / 2)}px) scale(${s})`;
    const ps = document.getElementById('pside');
    if (ps) ps.style.left = Math.round(cx + pwW / 2 + gap) + 'px';
  }
  const cmp = document.getElementById('cmp');
  if (cmp){
    const s = Math.min(0.8, (left.clientHeight - 90) / 868, (left.clientWidth - 80) / (414*2 + 36));
    cmp.style.transform = `scale(${s})`;
  }
}
function screenSpec(){
  const st = curStep();
  if (!st) return {v:'splash'};
  const t = st.task ? T(st.task) : null;
  if (st.kind === 'app') return t.phase === 'home' ? {v:'home', t} : {v:'rec', t, mode:'live'};
  if (st.kind === 'result') return t.phase === 'loading' ? {v:'loading', t} : t.phase === 'done' ? {v:'result', t, lock:true, gate:true} : {v:'result', t};
  if (st.view === 'after') return {v:'rec', t, mode:'locked', lock:true};
  if (st.view === 'initial') return {v:'rec', t, mode:'initial', lock:true};
  if (st.view === 'result') return {v:'result', t, lock:true};
  if (st.view === 'compare') return {v:'compare'};
  const intro = ['consent','demo','scale','info','scenario','taskguide','layout'].includes(st.kind) && !st.task && S.stepIdx < steps.findIndex(x => x.kind === 'app');
  return {v:'splash', sub: intro ? '' : '', lock: false};
}
function renderLeft(){
  const sp = screenSpec();
  if (sp.v === 'compare'){
    phoneMode = 'compare';
    const mk = (n, cap) => `<div class="one"><div class="cap" style="top:-34px;font-size:18px">${cap}</div><div class="phone"><div class="screen">${resultHTML(T(n), true)}<div class="lock" style="background:rgba(17,24,39,.06)"></div></div></div></div>`;
    left.innerHTML = `<div id="cmp" class="compare" style="transform-origin:center center">${mk(1,'첫 번째 쇼핑')}${mk(2,'두 번째 쇼핑')}</div>`;
    left.querySelectorAll('.toast').forEach(e => e.remove());
    fitPhone();
    return;
  }
  ensurePhone();
  const scr = document.getElementById('screen');
  const old = scr.querySelector('.scroll');
  if (old && old.dataset.sk) scrollMem[old.dataset.sk] = old.scrollTop;
  let html = '';
  if (sp.v === 'home') html = homeHTML();
  else if (sp.v === 'rec') html = recHTML(sp.t, sp.mode);
  else if (sp.v === 'loading') html = loadingHTML();
  else if (sp.v === 'result') html = resultHTML(sp.t, !!sp.lock);
  else html = splashHTML(sp.sub);
  if (sp.lock) html += sp.gate
    ? `<div class="lock lite"><div class="lock-pill">${ICON.check}선택을 마쳤어요</div></div>`
    : sp.mode === 'initial'
    ? `<div class="lock top"><div class="lock-note">${ICON.lock}<div><b>처음 받은 추천을 다시 보여 드려요</b><span>바꾼 조건은 그대로 반영돼요</span></div></div></div>`
    : `<div class="lock"><div class="lock-pill">${ICON.lock}질문에 답하는 동안 화면은 잠겨요</div></div>`;
  scr.innerHTML = html;
  applyNudge(sp, scr);
  if (sp.v === 'result' || scr.querySelector('.bottom [data-act=done]')) tickDone();   // V22_FB_11: [완료] 5초
  renderPhoneChrome(sp);
  const sc = scr.querySelector('.scroll');
  if (sc){
    if (sc.dataset.sk && scrollMem[sc.dataset.sk] != null) sc.scrollTop = scrollMem[sc.dataset.sk];
    sc.addEventListener('scroll', onAppScroll, {passive:true});
  }
  fitPhone();
}
function onAppScroll(e){
  const sc = e.currentTarget, st = curStep();
  if (!st || !st.task) return;
  scrollMem[sc.dataset.sk] = sc.scrollTop;
  const t = T(st.task);
  if (st.kind === 'app' && t.phase === 'rec'){
    const r = Math.min(1, (sc.scrollTop + sc.clientHeight) / sc.scrollHeight);
    if (r > t.m.scroll_max + 0.02){ t.m.scroll_max = Math.round(r*100)/100; log('scroll', {task:t.n, depth:t.m.scroll_max}); }
  }
}
function appToast(msg){
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2000);
}

/* 앱 클릭 */
function onAppClick(e){
  const st = curStep();
  if (!st || !(st.kind === 'app' || st.kind === 'result')) return;
  const t = T(st.task);
  t.m.n_clicks++;
  const el = e.target.closest('[data-act]');
  if (!el){ log('app_click', {task:t.n, target:'none'}); return; }
  const act = el.dataset.act, v = el.dataset.v;
  if (el.disabled) return;
  if (st.kind === 'app'){
    if (act === 'open-rec' && t.phase === 'home'){
      t.phase = 'rec'; t.m.t_rec = elapsed(); t.nudge = null; t.finger = false; t.shine = false; log('rec_open', {task:t.n, type:t.type, x2:S.cond.X2}); save(); renderLeft(); renderTaskPanel(st); scheduleNudge(t); return;
    }
    if (t.phase === 'rec'){
      if (act === 'ex-style' || act === 'ex-brand' || act === 'ex-product'){
        const kind = act.slice(3);
        const i = t.excl.findIndex(x => x.kind === kind && x.v === v);
        if (i >= 0){ t.excl.splice(i,1); opDone(t, {op:'undo', kind, v}); }
        else {
          const why = (CONFIG.MAX_OPS && t.excl.length >= CONFIG.MAX_OPS) ? 'max' : exclBlock(t, t.excl.concat([{kind, v}]));   // v22: 개수 제한 없음
          if (why){ t.m.n_blocked++; log('op_blocked', {task:t.n, kind, v, why}); appToast(BLOCK_MSG[why]()); }
          else { t.excl.push({kind, v}); opDone(t, {op:'exclude', kind, v}); }
        }
        return;
      }
      if (act === 'attr'){
        const k = el.dataset.k;
        if (t.cond[k] === v){ t.cond = Object.assign({}, t.cond, {[k]:null}); opDone(t, {op:'attr_off', k, from:v, to:null}); return; }   // v20: 다시 누르면 선택 해제
        const next = Object.assign({}, t.cond, {[k]:v});
        const n = ['fit','mat','len'].filter(x => next[x] != null).length;
        const maxA = S.cond.X2 === '사전' ? (CONFIG.MAX_OPS_PRE_A || CONFIG.MAX_OPS) : CONFIG.MAX_OPS;   // v22: 0 = 제한 없음(조건 3개까지 모두)
        if (maxA && n > maxA){ t.m.n_blocked++; log('op_blocked', {task:t.n, k, v}); appToast(`조건은 ${maxA}개까지 고를 수 있어요`); return; }
        const from = t.cond[k]; t.cond = next; opDone(t, {op:'attr', k, from, to:v}); return;
      }
      if (act === 'reset'){
        t.excl = []; t.cond = EMPTY_COND(); t.m.n_reset = (t.m.n_reset || 0) + 1;
        log('reset', {task:t.n}); save(); renderLeft(); return;
      }
      if (act === 'submit'){
        if (opsCount(t) === 0){
          // 회색(비활성) 버튼: 화면에는 아무 반응 없이, 누른 횟수만 조용히 기록
          t.m.n_empty_submit++; log('submit_empty', {task:t.n});
          return;
        }
        t.result = computeResult(t); t.phase = 'submitted'; t.m.t_submit = elapsed();
        log('submit', {task:t.n, selection:selectionText(t), ops:opsCount(t), replaced:t.result.replaced.join(','), nRemoved:t.result.nRemoved});
        t.nudge = null; t.finger = false; clearTimeout(nudgeTimer); goNext(); return;   // 결과 화면으로 바로
      }
    }
  }
  if (st.kind === 'result' && act === 'toggle-default' && t.phase === 'result'){
    t.viewDefault = !t.viewDefault;
    if (t.viewDefault){ t.m.n_default_view = (t.m.n_default_view || 0) + 1; t.dvT0 = elapsed(); }
    else if (t.dvT0 != null){ t.m.default_view_ms = (t.m.default_view_ms || 0) + elapsed() - t.dvT0; t.dvT0 = null; }
    log('default_view', {task:t.n, on:t.viewDefault}); save(); renderLeft(); return;
  }
  if (st.kind === 'result' && act === 'retry' && t.phase === 'result' && CONFIG.RETRY_ON){
    // [다시 해 보기]: 앞 회차는 기록으로 남기고 새로 시작해요(v22의 [이전 단계로] → V22_FB_3 이름 되돌림 → V22_FB_5 네 칸 같게)
    t.rounds = t.rounds || [];
    t.rounds.push({selection:selectionText(t), ops:opsCount(t), result:t.result ? t.result.items.map(i => i.id).join('|') : '', at:elapsed()});
    t.result = null; t.m.n_retry = (t.m.n_retry || 0) + 1;
    // V22_FB_3 (11/7 교수님 피드백): 사전은 결과를 본 뒤 조건을 고치면 '본 뒤에 고치기'(= 사후)가 되므로 홈 화면부터 새로 시작 — 고른 것 비움 · 회차 기록은 남김
    //   사후는 그대로 첫 추천 6개 화면으로(고른 것 유지 — 본 뒤에 고치는 것이 사후 조건)
    // V22_FB_5 (11/7 설계 기준 점검 ③): 네 칸 모두 같은 규칙 — 홈부터 새로, 고른 것 비움(사후도 홈 → 첫 추천 6개 → 처음부터 고치기 = 사후 정의 그대로)
    t.phase = 'home'; t.excl = []; t.cond = EMPTY_COND(); t.nudge = null; t.finger = false; t.shine = false;
    log('retry', {task:t.n, round:t.rounds.length + 1, restart:1});
    S.stepIdx = steps.findIndex(x => x.id === `K${t.n}_app`); enterStep(); return;
  }
  if (st.kind === 'result' && act === 'done' && t.phase === 'result' && doneLeft(t) > 0){ log('done_early', {task:t.n, left:doneLeft(t)}); return; }   // V22_FB_11 엑셀 7번
  if (st.kind === 'result' && act === 'done' && t.phase === 'result'){
    if (t.viewDefault && t.dvT0 != null){ t.m.default_view_ms = (t.m.default_view_ms || 0) + elapsed() - t.dvT0; t.dvT0 = null; }
    t.viewDefault = false;
    t.phase = 'done'; t.m.t_done = elapsed(); log('done', {task:t.n}); save(); renderLeft(); return;   // v20: [설문 시작하기]를 눌러야 넘어감
  }
  log('app_click', {task:t.n, target:act + (v ? ':' + v : '')});
}
function opDone(t, d){
  t.m.n_ops++; t.nudge = null; t.finger = false;
  if (t.m.t_first_op == null) t.m.t_first_op = elapsed();
  log('op', Object.assign({task:t.n, active:opsCount(t)}, d));
  save(); renderLeft();
}

/* =========================================================
   오른쪽 패널
   ========================================================= */
const rightEl = document.getElementById('right'), fullEl = document.getElementById('full'), fcard = document.getElementById('fcard'), appEl = document.getElementById('app');
let pbody = document.getElementById('pbody'), pfoot = document.getElementById('pfoot');
function useContainer(mode){
  const full = mode === 'full';
  appEl.classList.toggle('off', full); fullEl.classList.toggle('on', full);
  appEl.classList.toggle('phoneonly', mode === 'phone');   // v20: 쇼핑 중에는 폰만(오른쪽 안내 · 설문 숨김)
  closeReview();
  pbody = document.getElementById(full ? 'fbody' : 'pbody');
  pfoot = document.getElementById(full ? 'ffoot' : 'pfoot');
  // 안 보이는 쪽은 비워서 같은 id(nextBtn 등)가 두 개 생기지 않게
  document.getElementById(full ? 'pbody' : 'fbody').innerHTML = '';
  document.getElementById(full ? 'pfoot' : 'ffoot').innerHTML = '';
}
function renderTop(){
  const st = curStep(), ci = STAGES.findIndex(s => s.key === st.stage);
  document.getElementById('top').innerHTML = `<div class="brand"><i>AI</i>AI 추천 경험 연구</div><div class="stepper">${STAGES.map((s,i) => {
    const cls = i < ci ? 'done' : i === ci ? 'cur' : '';
    const badge = i < ci ? '<span class="n">✓</span>' : '<span class="n dot"></span>';
    const name = stageLabel(s);
    return `${i ? '<span class="stg-sep"></span>' : ''}<div class="stg ${cls}" style="--cc:${stageColor(s.key)}" ${DEV ? `data-stage="${s.key}" title="연구자: 이 단계로 이동"` : ''}>${badge}${esc(name)}</div>`;
  }).join('')}</div>`;
}
function setFoot(label, enabled, act){
  if (!label){ pfoot.innerHTML = ''; pfoot.style.display = 'none'; return; }
  pfoot.style.display = '';
  const back = canGoBack();
  pfoot.classList.toggle('two', back);
  pfoot.innerHTML = `${back ? '<button class="btn" id="prevBtn" data-act="prev">← 이전</button>' : ''}<button class="btn" id="nextBtn" data-act="${act||'next'}" ${enabled?'':'disabled'}>${label}</button>`;
}
function setNextEnabled(on){ const b = document.getElementById('nextBtn'); if (b) b.disabled = !on; }
function header(){
  const st = curStep(), box = st.mode === 'full' ? fcard : rightEl;
  const total = steps.length - 1;
  box.style.setProperty('--cc', stageColor(st.stage));
  box.querySelector('.p-bar i').style.width = Math.round(Math.min(S.stepIdx, total) / total * 100) + '%';
  const sg = STAGES.find(s => s.key === st.stage);
  let cnt = '';
  if (st.stage === 'setup'){ const l = steps.filter(x => x.stage === 'setup' && (x.kind !== 'phone' || (S.consent && S.consent.phone) || x === st)); cnt = `${l.indexOf(st) + 1} / ${l.length}`; }   // 번호를 안 받는 사람은 번호 화면을 세지 않아요
  else if (st.q){ const l = steps.filter(x => x.stage === st.stage && x.q); cnt = `질문 ${l.indexOf(st) + 1} / ${l.length}`; }
  box.querySelector('.ph').textContent = sg ? stageLabel(sg) : '';
  box.querySelector('.pcnt').textContent = cnt;
}
function ctxLine(st){   // v20: 설문 화면에는 폰이 없어요. 필요하면 [화면 다시 보기]로 잠긴 화면을 띄워요
  if (st.view === 'after') return '방금 추천을 맞춘 화면을 떠올리며 답해 주세요.';
  if (st.view === 'initial') return '처음 받은 추천 6개를 떠올리며 답해 주세요.';
  if (st.view === 'result') return '방금 받은 추천 결과를 떠올리며 답해 주세요.';
  return '';
}
function reviewBtn(st){ return (CONFIG.REVIEW_ON && st.task && ['after','initial','result'].includes(st.view)) ? `<button class="rvbtn" data-act="review">${SVG.eye}화면 다시 보기</button>` : ''; }
function ans(code){ return S.answers[code] ? S.answers[code].v : undefined; }
function setAns(code, v){
  S.answers[code] = {v, rt: now() - stepT0, at: elapsed()};
  log('answer', {code, v});
}
/* A11 번호: 'Q11' → 11. A11에 없는 X 문항은 맨 뒤 */
function qNum(code){ const m = /^Q(\d+)$/.exec(code); return m ? +m[1] : 1000; }
/* v20: 화면에 보이는 번호 = W10 번호(A11-0 대조표). 저장 열 이름(Q코드)은 그대로 */
const DISP_NO = {Q2:1,Q3:2,ATT0:3,Q11:4,Q12:5,Q13:6,Q14:7,Q15:8,Q16:9,Q17:10,Q18:11,Q19:12,Q20:13,Q21:14,Q22:15,Q23:16,Q24:17,Q25:18,Q26:19,Q27:20,Q28:21,Q29:22,Q8:23,Q30:24,Q31:25,Q32:26,Q1:27,Q4:28,Q5:29};
function qNo(code){ const n = DISP_NO[code]; return n ? `<span class="qn">${n}</span>` : ''; }
function scaleItems(st){
  const b = BLOCKS[st.block];
  let items = b.items.slice();
  if (st.extra) items.push(...[].concat(st.extra));   // v22: 여러 개 가능
  if (!S.orders[st.id]){
    S.orders[st.id] = items.map(i => i.code).sort((a, b) => qNum(a) - qNum(b));   // A11 번호 순서(무작위 없음)
    log('item_order', {order:S.orders[st.id].join(',')});
  }
  return S.orders[st.id].map(c => items.find(i => i.code === c));
}
function renderScale(st){
  const b = BLOCKS[st.block], p = pre(st), items = scaleItems(st);
  const c = ctxLine(st);
  let ask = b.ask || (st.task ? '이번 쇼핑을 떠올리며, 각 문장에 얼마나 동의하는지 골라 주세요.' : '각 문장에 얼마나 동의하는지 골라 주세요.');
  let h = st.title ? `<h2 class="pt">${esc(st.title)}</h2>` : '';
  h += c ? `<div class="ctx"${st.title ? ' style="margin-top:14px"' : ''}><span>${c}</span>${reviewBtn(st)}</div>` : '';
  h += `<div class="ask">${ask}</div>`;
  h += items.map(it => {
    const code = itCode(st, it), v = ans(code);
    if (it.opts) return `<div class="q"><div class="qt">${qNo(it.code)}${esc(it.text)}</div><div class="hopts">${it.opts.map(o => `<button class="opt ${v===o[0]?'on':''}" data-act="opt" data-code="${code}" data-v="${o[0]}"><span class="rd"></span>${esc(o[1])}</button>`).join('')}</div></div>`;
    const btns = [1,2,3,4,5,6,7].map(n => `<button class="${v===n?'on':''}" data-act="lk" data-code="${code}" data-v="${n}">${n}</button>`).join('');
    if (it.l) return `<div class="q sd"><div class="qt">${qNo(it.code)}${esc(it.text || '')}</div><div class="lk">${btns}</div><div class="anch"><span>${esc(it.l)}</span><span>${esc(it.r)}</span></div></div>`;
    return `<div class="q"><div class="qt">${qNo(it.code)}${esc(it.text)}</div><div class="lk">${btns}</div><div class="anch"><span>전혀 그렇지 않다</span><span>매우 그렇다</span></div></div>`;
  }).join('');
  pbody.innerHTML = h;
  setFoot('다음', items.every(it => ans(itCode(st, it)) != null));
}
function renderMC(st){
  const items = mcItems(st);
  if (!S.orders[st.id]){ S.orders[st.id] = items.map(m => m.code + ':' + (m.fixedOpts ? m.opts.map(o => o[0]) : shuffle(m.opts.map(o => o[0]))).join('/')); log('option_order', {order:S.orders[st.id].join(',')}); }
  const ord = {}; S.orders[st.id].forEach(x => { const [c,o] = x.split(':'); ord[c] = o.split('/'); });
  let h = (!st.pref && st.view) ? `<div class="ctx"><span>${ctxLine(st)}</span>${reviewBtn(st)}</div>` : '';   // V22_FB_14: 21 · 22번에도 [화면 다시 보기](CONFIG.REVIEW_MC)
  h += `<div class="ask">${st.pref ? '하나를 골라 주세요. 정답은 없어요.' : '방금 한 쇼핑에 맞는 것을 골라 주세요.'}</div>`;   // v20: 조작점검은 다시 보기 없이
  h += items.map(m => {
    const code = mcCode(st, m), v = ans(code);
    const opts = (ord[m.code] || m.opts.map(o => o[0])).map(k => m.opts.find(o => o[0] === k));
    return `<div class="q"><div class="qt">${qNo(m.code)}${esc(m.q)}</div><div class="opts">${opts.map(o => `<button class="opt ${v===o[0]?'on':''}" data-act="opt" data-code="${code}" data-v="${o[0]}"><span class="rd"></span>${esc(o[1])}</button>`).join('')}</div></div>`;
  }).join('');
  pbody.innerHTML = h;
  setFoot('다음', items.every(m => ans(mcCode(st, m)) != null));
}

function startCountdown(sec, label){
  let left_ = DEV ? 0 : sec;
  const tick = () => {
    const b = document.getElementById('nextBtn'); if (!b) return;
    if (left_ <= 0){ b.disabled = false; b.textContent = label; return; }
    b.disabled = true; b.textContent = `${label} (${left_})`; left_--; scnTimer = setTimeout(tick, 1000);
  };
  clearTimeout(scnTimer); tick();
}

/* 휴대전화 번호(시작 설정 맨 앞, 선택 동의한 사람만): 보상 추첨에만 써요. 응답 행에 넣지 않고 따로 저장해요 */
function phoneHash(d){
  // 같은 번호인지 확인하는 지문(cyrb53). 서버 스크립트의 hash_()와 같은 계산
  const str = CONFIG.PHONE_SALT + ':' + d;
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++){ const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

function colLabels(cols){
  const Q = {}; questionList().forEach(q => { Q[q.code] = q; });
  const qText = code => Q[code] ? `${Q[code].v} · ${Q[code].text}` : null;
  return cols.map(c => {
    if (META_LABEL[c]) return META_LABEL[c];
    let m;
    if (qText(c)) return qText(c);
    if ((m = c.match(/^(.*)_rt$/)) && qText(m[1])) return '응답 시간(ms) · ' + Q[m[1]].text;
    if ((m = c.match(/^([DA])_(.*)$/))){ const base = 'task1_' + m[2]; const lab = qText(base) || (META_LABEL[m[2]] || ''); return `${m[1] === 'D' ? '결정' : '행동'} 과업 · ${lab || m[2]}`; }
    if ((m = c.match(/^att_(.*)_ok$/))) return `주의 점검 ${m[1]} 통과(1)`;
    if ((m = c.match(/^task([12])_Q27_ok$/))) return `과업 ${m[1]} 반영 확인 '예'(1)`;
    if ((m = c.match(/^task([12])_Q28_ok$/))) return `과업 ${m[1]} 유형 조작점검 정답(1)`;
    if ((m = c.match(/^task([12])_Q29_ok$/))) return `과업 ${m[1]} 시점 조작점검 정답(1)`;
    return '';
  });
}
function toCSV(rows, withLabels){
  const cols = []; rows.forEach(r => Object.keys(r).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
  const cell = v => { if (v == null) return ''; const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const head = [cols.join(',')];
  if (withLabels) head.push(colLabels(cols).map(cell).join(','));
  return '﻿' + [...head, ...rows.map(r => cols.map(c => cell(r[c])).join(','))].join('\n');
}

function fbWait(p, ms){ return Promise.race([p, new Promise(res => setTimeout(() => res(null), ms || 6000))]); }

async function fbAssignCell(){   // 16칸 중 가장 적게 찬 칸(같으면 무작위)을 고르고 그 칸 수를 1 올림. 충돌하면 다시 시도
  let aborted = false;
  const tx = fbdb.ref('meta/cellCounts').transaction(cur => {
    if (aborted) return;
    const counts = (cur && typeof cur === 'object') ? Object.assign({}, cur) : {};
    let min = Infinity; for (let c = 1; c <= 16; c++){ const n = counts['c'+c] || 0; if (n < min) min = n; }
    const cands = []; for (let c = 1; c <= 16; c++){ if ((counts['c'+c] || 0) === min) cands.push(c); }
    const pick = cands[Math.floor(Math.random()*cands.length)];
    counts['c'+pick] = min + 1; counts.lastCell = pick; counts.total = (counts.total || 0) + 1;
    return counts;
  });
  const res = await fbWait(tx, 6000);
  if (!res){ aborted = true; return null; }
  if (!res.committed) return null;
  const v = res.snapshot.val();
  return v && v.lastCell >= 1 && v.lastCell <= 16 ? v.lastCell : null;
}
async function fbAssignPilot(balanceRetry){   // V22_FB_24: meta/pilotAssign — arms {pre_on, pre_off, post_on, post_off} 중 적은 묶음(같으면 무작위) → 그 시점의 8칸 중 적게 쓰인 칸(같으면 무작위) → 둘 다 1 올림
  let aborted = false;
  try{
    const tx = fbdb.ref('meta/pilotAssign').transaction(cur => {
      if (aborted) return;
      const c = (cur && typeof cur === 'object') ? JSON.parse(JSON.stringify(cur)) : {}; c.arms = c.arms || {}; c.cells = c.cells || {};
      const rnd = a => a[Math.floor(Math.random()*a.length)];
      let arm;
      if (balanceRetry){ const arms = ['pre_on','pre_off','post_on','post_off']; const min = Math.min.apply(null, arms.map(a => c.arms[a] || 0)); arm = rnd(arms.filter(a => (c.arms[a] || 0) === min)); }
      else { const x2 = ['pre','post'].map(k => [k, (c.arms[k + '_on'] || 0) + (c.arms[k + '_off'] || 0)]); const min = Math.min(x2[0][1], x2[1][1]); arm = rnd(x2.filter(p => p[1] === min).map(p => p[0])) + (CONFIG.RETRY_ON ? '_on' : '_off'); }
      const pre = arm.indexOf('pre_') === 0; const cells = []; for (let k = 1; k <= 16; k++){ if ((cellToCond(k).X2 === '사전') === pre) cells.push(k); }
      const cmin = Math.min.apply(null, cells.map(k => c.cells['c'+k] || 0)); const cell = rnd(cells.filter(k => (c.cells['c'+k] || 0) === cmin));
      c.arms[arm] = (c.arms[arm] || 0) + 1; c.cells['c'+cell] = (c.cells['c'+cell] || 0) + 1; c.total = (c.total || 0) + 1; c.last = {arm, cell, at:new Date().toISOString()};
      return c;
    });
    const res = await fbWait(tx, 6000);
    if (!res){ aborted = true; return null; }
    if (!res.committed) return null;
    const v = res.snapshot.val(); const last = v && v.last; if (!last || !(last.cell >= 1 && last.cell <= 16)) return null;
    return {cell:last.cell, arm:last.arm, on: /_on$/.test(last.arm) ? 1 : 0};
  }catch(e){ return null; }
}
async function fbAssignRetry(k){   // V22_FB_7: meta/retryCounts/{pre|post} 의 on · off 중 적은 쪽(같으면 무작위)을 고르고 1 올림 — fbAssignCell과 같은 방식
  let aborted = false;
  try{
    const tx = fbdb.ref('meta/retryCounts/' + k).transaction(cur => {
      if (aborted) return;
      const c = (cur && typeof cur === 'object') ? Object.assign({}, cur) : {};
      const on = c.on || 0, off = c.off || 0;
      const pick = on < off ? 1 : off < on ? 0 : (Math.random() < .5 ? 1 : 0);
      c[pick ? 'on' : 'off'] = (pick ? on : off) + 1; c.last = pick; c.total = (c.total || 0) + 1;
      return c;
    });
    const res = await fbWait(tx, 6000);
    if (!res){ aborted = true; return null; }
    if (!res.committed) return null;
    const v = res.snapshot.val();
    return v && (v.last === 0 || v.last === 1) ? v.last : null;
  }catch(e){ aborted = true; return null; }   // 쓰기 권한이 없으면 여기로 → 무작위
}
async function assignRetry(){   // ?retry=auto: 칸(시점)이 정해진 뒤 한 번. 결과는 세션(S.retryAuto)에 저장해 이어 하기 때 그대로
  if (!RETRY_AUTO || S.retryAuto) return applyRetry();

  let on = null, source = 'random';
  if (CONFIG.FIREBASE_ASSIGN && !DEV && fbReady()){ on = await fbAssignRetry(k); source = on == null ? 'random(firebase-fail)' : 'firebase'; }
  if (on == null) on = Math.random() < .5 ? 1 : 0;

async function fbAssign(fixedCell){   // Apps Script와 같은 역할: {dup} | {pid, cell}

function devSkip(silent){
  const st = curStep(), p = pre(st);
  const rnd = () => 1 + Math.floor(Math.random()*7);
  const advance = () => { if (silent){ S.stepIdx++; stepT0 = now(); } else goNext(); };
  switch (st.kind){
    case 'consent': S._ck = {a:true,b:true,c:CONFIG.PHONE_ON}; S.consent = {participate:true,data:true,phone:CONFIG.PHONE_ON,at:new Date().toISOString(),version:CONFIG.CONSENT_VERSION}; S.assigned = true; advance(); break;
    case 'demo': S.answers.Q2 = {v:24,rt:0,at:elapsed()}; S.answers.Q3 = {v:'1~2회',rt:0,at:elapsed()}; if (CONFIG.ATT0_ON) S.answers.ATT0 = {v:ATT0.att,rt:0,at:elapsed()}; advance(); break;   // V22_FB: v22 자극 전 화면(나이 · 구매 빈도 · 주의 점검 3번)에 맞춤 — 성별(Q1) · AI 이용(Q4)은 마무리 화면에서 채움 (미리보기 전용)

    case 'mc': { const t = st.task ? T(st.task) : null; const val = {Q28:t && t.type, Q29:S.cond.X2==='사전'?'pre':'post', Q32:Math.random() < .5 ? 'D' : 'A'}; mcItems(st).forEach(m => { S.answers[mcCode(st, m)] = {v:val[m.code],rt:0,at:elapsed()}; }); advance(); break; }
    case 'phone': if (CONFIG.PHONE_ON){ S.phone = '01000000000'; S.phoneHash = phoneHash(S.phone); } S.assigned = true; advance(); break;
    case 'app': {
      const t = T(st.task);
      if (t.m.t_start == null) t.m.t_start = elapsed();
      t.phase = 'rec'; t.m.t_rec = t.m.t_rec || elapsed();
      if (opsCount(t) === 0){
        if (t.type === 'A') t.cond = Object.assign({}, t.cond, {fit:'레귤러', mat:'울'});

    case 'complete': if (!silent){ doSubmit(); } else advance(); break;
    case 'end': break;
    default: advance();
  }

function leaveSummary(){
  // 단계(stage)별로 나눠 셉니다. 과업 1 = T1·T2, 과업 2 = T3·T4
  const out = {all:{n:0, ms:0, list:[]}, task1:{n:0, ms:0}, task2:{n:0, ms:0}};
  let open = null;
  const close = (end) => {
    const ms = Math.max(0, end - open.t), k = /^T[12]$/.test(open.stage) ? 'task1' : /^T[34]$/.test(open.stage) ? 'task2' : null;
    out.all.n++; out.all.ms += ms; out.all.list.push(`${open.step}@${(open.t/1000).toFixed(1)}+${(ms/1000).toFixed(1)}`);
    if (k){ out[k].n++; out[k].ms += ms; }
    open = null;
  };
  S.log.forEach(e => {
    if (e.type === 'leave' && !open) open = e;
    else if (e.type === 'return' && open) close(e.t);
  });
  if (open) close(elapsed());
  return out;
}

  const st = S && curStep(); if (!st || st.stage !== 'intro' || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.closest && e.target.closest('input[type=number],input[type=tel],textarea,select')) return;
  if (e.key === 'ArrowRight'){ const b = document.getElementById('nextBtn'); if (b && !b.disabled && b.dataset.act === 'tut-next'){ e.preventDefault(); b.click(); } }
  else if (e.key === 'ArrowLeft'){ const b = pfoot.querySelector('[data-act="tut-prev"]'); if (b && !b.disabled){ e.preventDefault(); b.click(); } }
});
/* 확인용 [처음으로] */
function setupRestart(){
  if (!(DEV || (!CONFIG.ONE_TIME_ONLY && CONFIG.RESTART_BTN))) return;
  const b = document.getElementById('restartBtn'), lbl = b.querySelector('span');
  let tm = null;
  b.hidden = false; document.body.classList.add('has-restart');
  b.addEventListener('click', () => {
    if (b.classList.contains('ask')){ clearTimeout(tm); restartAll(); return; }
    b.classList.add('ask'); lbl.textContent = '한 번 더 누르면 처음부터';
    tm = setTimeout(() => { b.classList.remove('ask'); lbl.textContent = '처음으로'; }, 3000);
  });
}
function init(){
  setupRestart();
  if (isMobile() && !DEV){
    blockScreen(`<h2 class="pt">PC로 접속해 주세요</h2><p class="lead">이 연구는 PC 화면에 맞춰져 있어요. 아래 버튼으로 링크를 복사해 PC에서 열어 주세요.</p><button class="btn" style="margin-top:20px" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href).then(()=>this.textContent='복사했어요')">링크 복사</button>`);
    return;
  }
  const done = getDone();
  if (done && done.screened && !DEV && ONE_TIME){
    blockScreen(`<h2 class="pt">참여해 주셔서 감사합니다</h2><p class="lead">${screenMsg(done.reason)}</p>`);
    return;
  }
  if (done && !DEV && ONE_TIME){
    blockScreen(`<h2 class="pt">이미 참여를 마치셨어요</h2><p class="lead">이 기기에서는 한 번만 참여할 수 있어요. 참여해 주셔서 감사합니다.</p>`);
    return;
  }
  const saved = load(KEY_SESSION);
  if (saved && !saved.done && String(saved.study).indexOf(CONFIG.STUDY_VERSION) === 0 && (saved.dev || String(saved.pid || '').charAt(0) === CONFIG.PID_PREFIX) && !((DEV || !ONE_TIME) && QS.get('fresh') === '1')){
    S = saved; S.resumed = (S.resumed || 0) + 1; applyRetry(); buildSteps();
    const st = curStep();
    if (st && st.kind === 'app'){ const t = T(st.task); t.phase = 'home'; t.excl = []; t.cond = EMPTY_COND(); t.nudge = null; t.finger = false; t.shine = false; }   // V22_FB_7 수정 목록 10: 이어 하기도 빈 채로 시작(D16) — 전에는 AI 기본값(오버핏 · 아크릴 · 숏)이 골라져 있었음
    log('resume', {});
  } else {
    const u = urlCond();
    const W = W_LEVELS[Math.random()<.5?0:1], X2 = X2_LEVELS[Math.random()<.5?0:1], O = ORDERS[Math.random()<.5?0:1], SO = SET_ORDERS[Math.random()<.5?0:1];
    S = u ? newSession(u.cond, u.source) : newSession(cellToCond(condToCell(W, X2, O, SO)), CONFIG.SERVER_URL ? 'pending' : 'random');
    const rf = load(KEY_RESTART); if (rf){ S.restartOf = rf; try{ localStorage.removeItem(KEY_RESTART); }catch(e){} }
    if (DEV && RETRY_AUTO) assignRetry();   // 미리보기에서는 바로 무작위로
    buildSteps();
    log('start', {vw:innerWidth, vh:innerHeight});
  }
  enterStep();
  checkWidth();
  addEventListener('resize', () => { checkWidth(); });
  let rt = null;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { log('resize', {vw:innerWidth, vh:innerHeight}); }, 600); });
  document.addEventListener('visibilitychange', () => { log('visibility', {state:document.visibilityState}); if (document.hidden) markLeave('hidden'); else markReturn('visible'); });
  addEventListener('blur', () => markLeave('blur'));
  addEventListener('focus', () => markReturn('focus'));
  addEventListener('beforeunload', e => { if (!restarting && !DEV && S && !S.submitted && !S.done && S.stepIdx > 0){ save(); e.preventDefault(); e.returnValue = ''; } });
}
init();
</script>
